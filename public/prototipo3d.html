const M={

};
function sub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]]}function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}

function distPath(x,z){let d=1e9;for(let i=0;i<path.length-1;i++){const a=path[i],b=path[i+1];const vx=b[0]-a[0],vz=b[1]-a[1],wx=x-a[0],wz=z-a[1];let t=(wx*vx+wz*vz)/(vx*vx+vz*vz);t=clamp(t,0,1);d=Math.min(d,Math.hypot(wx-vx*t,wz-vz*t))}return d+(vnoise(x*.3,z*.3)-.5)*1.3}

{const N=170,st=2*S/N,P=[];for(let j=0;j<=N;j++)for(let i=0;i<=N;i++){const x=-S+i*st,z=-S+j*st,e=.25;const n=norm([height(x-e,z)-height(x+e,z),2*e,height(x,z-e)-height(x,z+e)]);P.push([[x,height(x,z),z],tcol(x,z),n])}

 const base=mix(hex(0x1f4a30),hex(0x27553a),t.hue),hi=mix(hex(0x5e8a52),hex(0x6f9a58),t.hue);

seed=777;{let count=0;const target=Q.get('lite')||MOB?35000:70000;let guard=0;

 // flowers as tiny cards

{const y=height(fire.x,fire.z);for(let k=0;k<9;k++){const a=k/9*6.283;const x=fire.x+Math.cos(a)*.95,z=fire.z+Math.sin(a)*.95;rockMesh(x,z,.28)}

 logAt(fire.x-3.4,fire.z-1.7,.35,2.8);logAt(fire.x+1.4,fire.z+2.6,-.25,2.6);

{const R=pond.r+1.0,segs=72,c=[pond.x,-.42,pond.z];for(let k=0;k<segs;k++){const a0=k/segs*6.283,a1=(k+1)/segs*6.283;const p0=[pond.x+Math.cos(a0)*R*1.3,-.42,pond.z+Math.sin(a0)*R],p1=[pond.x+Math.cos(a1)*R*1.3,-.42,pond.z+Math.sin(a1)*R];

function leafAtlas(){const c=document.createElement('canvas');c.width=768;c.height=256;const g=c.getContext('2d');

 seed=31;clump(0,0,(x,y,f)=>{const s=rr(14,24),rot=rr(0,6.283),l=rr(.62,1);g.save();g.translate(x,y);g.rotate(rot);const grd=g.createLinearGradient(0,-s,0,s);grd.addColorStop(0,`rgb(${255*l|0},${255*l|0},${255*l|0})`);grd.addColorStop(1,`rgb(${180*l|0},${180*l|0},${180*l|0})`);

 // variant 1: pine needles fan
