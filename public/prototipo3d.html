const M={

 ortho(l,r,b,t,n,f){return new Float32Array([2/(r-l),0,0,0,0,2/(t-b),0,0,0,0,-2/(f-n),0,-(r+l)/(r-l),-(t+b)/(t-b),-(f+n)/(f-n),1])},
 look(e,c,u){let z=norm(sub(e,c)),x=norm(cross(u,z)),y=cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,e),-dot(y,e),-dot(z,e),1])}
};
function sub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]]}function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}function norm(a){const l=Math.hypot(...a);return[a[0]/l,a[1]/l,a[2]/l]}
// ---------- rng / noise ----------
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function hash(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const fbm=(x,y)=>vnoise(x,y)*.55+vnoise(x*2.1,y*2.1)*.28+vnoise(x*4.3,y*4.3)*.17;
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const hex=h=>[(h>>16&255)/255,(h>>8&255)/255,(h&255)/255];
// ---------- world layout ----------
const S=36; // half size
const path=[[-40,14],[-24,9],[-12,3],[-3,-1],[6,-3],[16,-9],[26,-13],[40,-16]];
function distPath(x,z){let d=1e9;for(let i=0;i<path.length-1;i++){const[a,b]=[path[i],path[i+1]];const vx=b[0]-a[0],vz=b[1]-a[1],wx=x-a[0],wz=z-a[1];let t=(wx*vx+wz*vz)/(vx*vx+vz*vz);t=Math.max(0,Math.min(1,t));d=Math.min(d,Math.hypot(wx-vx*t,wz-vz*t))}return d+ (vnoise(x*.35,z*.35)-.5)*1.4}
const pond={x:9,z:9,r:6.5};
function pondD(x,z){return Math.hypot((x-pond.x)/1.25,z-pond.z)-pond.r+(vnoise(x*.4+9,z*.4)-.5)*1.6}
function height(x,z){let h=(fbm(x*.06,z*.06)-.5)*1.6;const p=pondD(x,z);if(p<1.5)h-=Math.min(1.1,(1.5-p)*.35);const dp=distPath(x,z);if(dp<2.4)h-= (2.4-dp)*.05;return h}
// ---------- geometry builder ----------
function Geo(){return{v:[],add(p,c,uv){this.v.push(p[0],p[1],p[2],c[0],c[1],c[2],uv?uv[0]:-1,uv?uv[1]:-1)},tri(a,b,c,ca,cb,cc){this.add(a,ca);this.add(b,cb||ca);this.add(c,cc||ca)}}}
const terr=Geo(),objs=Geo(),water=Geo();
// terrain
const N=150,step=2*S/N;const G1=hex(0x4a7a33),G2=hex(0x6a9a3e),G3=hex(0x9bb257),G4=hex(0x355f2c),DIRT=hex(0xb08a55),DIRT2=hex(0x8f6a3e),SAND=hex(0xd8c38b);
function tcol(x,z){const n=fbm(x*.05+3,z*.05),m=fbm(x*.18,z*.18);let c=n<.42?mix(G4,G1,n/.42):n<.62?mix(G1,G2,(n-.42)/.2):mix(G2,G3,Math.min(1,(n-.62)/.25));

 const dp=distPath(x,z);if(dp<2.6){const t=Math.min(1,(2.6-dp)/1.2);c=mix(c,mix(DIRT,DIRT2,fbm(x*.4,z*.4)),t)}

 return c}
const P=[];for(let j=0;j<=N;j++)for(let i=0;i<=N;i++){const x=-S+i*step,z=-S+j*step,e=.3;const nx=height(x-e,z)-height(x+e,z),nz=height(x,z-e)-height(x,z+e);const nl=Math.hypot(nx,2*e,nz);P.push([[x,height(x,z),z],tcol(x,z),[nx/nl,nz/nl]])}
for(let j=0;j<N;j++)for(let i=0;i<N;i++){const a=P[j*(N+1)+i],b=P[j*(N+1)+i+1],c=P[(j+1)*(N+1)+i],d=P[(j+1)*(N+1)+i+1];for(const q of[a,c,b,b,c,d])terr.add(q[0],q[1],q[2])}
// water
{const W=hex(0x3aa6b8);for(let k=0;k<48;k++){const a0=k/48*6.283,a1=(k+1)/48*6.283,R=pond.r+.5;water.tri([pond.x,-.35,pond.z],[pond.x+Math.cos(a1)*R*1.25,-.35,pond.z+Math.sin(a1)*R],[pond.x+Math.cos(a0)*R*1.25,-.35,pond.z+Math.sin(a0)*R],W)}}
// primitives
function prism(g,cx,cy,cz,r0,r1,h,sides,col,colTop){for(let k=0;k<sides;k++){const a0=k/sides*6.283,a1=(k+1)/sides*6.283;const p0=[cx+Math.cos(a0)*r0,cy,cz+Math.sin(a0)*r0],p1=[cx+Math.cos(a1)*r0,cy,cz+Math.sin(a1)*r0],q0=[cx+Math.cos(a0)*r1,cy+h,cz+Math.sin(a0)*r1],q1=[cx+Math.cos(a1)*r1,cy+h,cz+Math.sin(a1)*r1];g.tri(p0,q0,p1,col);g.tri(p1,q0,q1,col);if(r1>0)g.tri([cx,cy+h,cz],q1,q0,colTop||col)}}
function blob(g,cx,cy,cz,rx,ry,rz,col,jit,seg=7){const rows=seg,cols=seg*2,V=[];for(let r=0;r<=rows;r++){V.push([]);for(let c=0;c<=cols;c++){const th=r/rows*Math.PI,ph=c/cols*6.283,j=1+(c%cols&&r%rows?(rnd()-.5)*jit:0);V[r].push([cx+Math.sin(th)*Math.cos(ph)*rx*j,cy+Math.cos(th)*ry*j,cz+Math.sin(th)*Math.sin(ph)*rz*j])}}
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const k=V[r][c],l=V[r][c+1],m=V[r+1][c],n=V[r+1][c+1];const sh=mix(col,[col[0]*1.18,col[1]*1.18,col[2]*1.1],1-r/rows);g.tri(k,l,m,sh);g.tri(l,n,m,sh)}}
function tree(x,z,s,kind){const y=height(x,z);const bark=hex(0x6b4a2e);prism(objs,x,y-.2,z,.38*s,.26*s,2.4*s,7,bark);
 if(kind===0){const cs=[hex(0x2e6b2a),hex(0x3c8231),hex(0x4f9a3a)];blob(objs,x,y+3.2*s,z,2.1*s,1.6*s,2.1*s,cs[0],.18);blob(objs,x+.5*s,y+4.1*s,z-.3*s,1.6*s,1.3*s,1.6*s,cs[1],.2);blob(objs,x-.3*s,y+4.8*s,z+.2*s,1.1*s,.95*s,1.1*s,cs[2],.2)}
 else{const cs=[hex(0x245c33),hex(0x2f7040),hex(0x3b8048)];for(let k=0;k<4;k++)prism(objs,x,y+(1.6+k*1.05)*s,z,(2.0-k*.42)*s,0,1.6*s,8,cs[k%3])}}
function rock(x,z,s){const y=height(x,z);blob(objs,x,y+.2*s,z,1.0*s,.62*s,.85*s,hex(0x8a8f96),.35,4)}
// campfire + logs + tent-ish banner pole
function campfire(x,z){const y=height(x,z);for(let k=0;k<8;k++){const a=k/8*6.283;blob(objs,x+Math.cos(a)*1.1,y+.12,z+Math.sin(a)*1.1,.32,.22,.32,hex(0x7c7f86),.2,3)}

function log(x,z,a,len){const y=height(x,z)+.3;const dx=Math.cos(a),dz=Math.sin(a);for(let k=0;k<8;k++){const t0=k/8*6.283,t1=(k+1)/8*6.283;const o=(t)=>[Math.cos(t)*.3,Math.sin(t)*.3];const[a0,b0]=o(t0),[a1,b1]=o(t1);const P0=[x-dz*a0,y+b0,z+dx*a0],P1=[x-dz*a1,y+b1,z+dx*a1];const Q0=[P0[0]+dx*len,P0[1],P0[2]+dz*len],Q1=[P1[0]+dx*len,P1[1],P1[2]+dz*len];objs.tri(P0,Q0,P1,hex(0x6e4a2a));objs.tri(P1,Q0,Q1,hex(0x6e4a2a))}}

// scatter
seed=11;const placed=[];let tries=0;
while(placed.length<70&&tries<4000){tries++;const x=(rnd()*2-1)*(S-2),z=(rnd()*2-1)*(S-2);if(distPath(x,z)<4.5||pondD(x,z)<2.5||Math.hypot(x+6,z-4)<6||Math.hypot(x+1,z-1)<5)continue;if(placed.some(p=>Math.hypot(p[0]-x,p[1]-z)<4.2))continue;

for(let k=0;k<16;k++){const x=(rnd()*2-1)*(S-4),z=(rnd()*2-1)*(S-4);if(distPath(x,z)<3||pondD(x,z)<1)continue;rock(x,z,.6+rnd()*1.1)}

// ---------- character sprite (original pixel art) ----------
function makeSprite(){const c=document.createElement('canvas');c.width=32;c.height=48;const g=c.getContext('2d');

 // cloak back
 R(9,16,14,22,'#5b2a1e');R(8,18,1,18,O);R(23,18,1,18,O);
 // legs + boots
 R(12,36,3,7,'#4a3a2a');R(17,36,3,7,'#4a3a2a');R(11,42,5,4,'#2e2016');R(16,42,5,4,'#2e2016');R(11,46,5,1,O);R(16,46,5,1,O);
 // tunic
 R(11,20,10,17,'#3f6f8c');R(11,20,10,2,'#5a8fae');R(11,30,10,2,'#6b4a2a');R(15,30,2,2,'#e2b23a');
 R(10,20,1,17,O);R(21,20,1,17,O);R(11,37,10,1,O);
 // fur collar
 R(10,17,12,4,'#cdbb98');R(10,17,12,1,'#efe2c4');R(9,18,1,3,O);R(22,18,1,3,O);
 // arms
 R(7,21,3,10,'#3f6f8c');R(22,21,3,10,'#3f6f8c');R(7,30,3,3,'#e0a982');R(22,30,3,3,'#e0a982');R(6,21,1,12,O);R(25,21,1,12,O);
 // axe on right
 R(25,18,1,18,'#6b4a2a');R(26,17,4,6,'#b9c2cc');R(26,17,4,1,'#e7edf2');R(30,17,1,6,O);
 // head
 R(11,6,10,11,'#e7b58d');R(10,7,1,9,O);R(21,7,1,9,O);R(11,17,10,0,O);
 // hair (copper) + braid
 R(10,3,12,5,'#c2552a');R(10,3,12,1,'#e07a3f');R(9,5,1,8,'#c2552a');R(22,5,1,8,'#c2552a');R(9,4,1,1,O);R(22,4,1,1,O);R(10,2,12,1,O);

 R(13,10,2,2,'#1c1a2a');R(18,10,2,2,'#1c1a2a');R(13,10,1,1,'#ffffff');R(18,10,1,1,'#ffffff');

const spr=makeSprite();
// billboard character at (x,z)
const hero={x:-2.2,z:2.2};

const VS=`#version 300 es

layout(location=0)in vec3 aP;layout(location=1)in vec3 aC;layout(location=2)in vec2 aUV;

const FS=`#version 300 es

out vec4 o;

 vec3 base=vC;float alpha=1.;
 if(uMode==1){vec4 t=texture(uTex,vUV);if(t.a<.5)discard;base=pow(t.rgb,vec3(2.2));}

const SVS=`#version 300 es

const SFS=`#version 300 es

function prog(v,f){const p=gl.createProgram();for(const[t,s]of[[gl.VERTEX_SHADER,v],[gl.FRAGMENT_SHADER,f]]){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh));gl.attachShader(p,sh)}gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p}
const P1=prog(VS,FS),P2=prog(SVS,SFS);
function vao(arr){const a=gl.createVertexArray();gl.bindVertexArray(a);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(arr),gl.STATIC_DRAW);
 for(const[i,n,o]of[[0,3,0],[1,3,12],[2,2,24]]){gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,n,gl.FLOAT,false,32,o)}return{a,n:arr.length/8,b}}
const VT=vao(terr.v),VO=vao(objs.v),VW=vao(water.v);
// billboard (updated per frame)
const VB=vao(new Array(6*8).fill(0));
function billboard(right){const h=3.6,w=h*32/48,x=hero.x,z=hero.z,y=height(x,z);const r=[right[0]*w/2,0,right[2]*w/2];
 const p=(sx,sy)=>[x+r[0]*sx,y+h*sy,z+r[2]*sx];const v=[];const q=[[p(-1,0),[0,1]],[p(1,0),[1,1]],[p(1,1),[1,0]],[p(-1,0),[0,1]],[p(1,1),[1,0]],[p(-1,1),[0,0]]];
 for(const[pp,uv]of q)v.push(...pp,1,1,1,...uv);gl.bindBuffer(gl.ARRAY_BUFFER,VB.b);gl.bufferSubData(gl.ARRAY_BUFFER,0,new Float32Array(v))}
// sprite texture
const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,spr);
